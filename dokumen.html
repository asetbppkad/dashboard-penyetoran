<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dokumen Monitoring - Ismail</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="shortcut icon" href="assets/img/ismail-pro.jpg" type="image/x-icon">
</head>

<body>
    <header class="top">
        <div class="brand">
            <div class="mark" aria-hidden="true">S</div>
            <div>
                <h1>Dokumen</h1>
                <p>Pratinjau spreadsheet per periode</p>
            </div>
        </div>
        <div class="tools">
            <nav>
                <a class="nav-link" href="index.html">Dashboard</a>
                <a class="nav-link active" href="dokumen.html">Dokumen</a>
            </nav>
            <button class="btn ghost icon" id="btnTheme" aria-label="Ganti tema">
                <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
                </svg>
                <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div id="skeleton">
            <div class="grid doc-grid">
                <div class="sk tall"></div>
                <div class="sk tall"></div>
                <div class="sk tall"></div>
            </div>
        </div>

        <div id="error" class="state" hidden>
            <h2>Dokumen gagal dimuat</h2>
            <p id="errMsg" class="muted"></p>
            <button class="btn" id="btnRetry">Coba Lagi</button>
        </div>

        <div id="docApp" hidden>
            <div id="docEmpty" class="empty" hidden>Belum ada dokumen untuk ditampilkan.</div>
            <section class="grid doc-grid" id="docGrid" aria-label="Daftar dokumen"></section>
        </div>
    </main>
    <footer>
        <p>Data bersumber dari Google Spreadsheet · Dibuat dengan &hearts; oleh <a
                href="https://ismailportfolio.pages.dev/" class="identity">Ismail</a></p>
        <p>&copy; <span id="fYear"></span> Seluruh hak cipta dilindungi.</p>
    </footer>
    <script src="assets/documents.js"></script>
    <script>document.getElementById('fYear').textContent = new Date().getFullYear();</script>
</body>

</html>
